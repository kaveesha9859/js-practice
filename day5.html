<!DOCTYPE html>
<html>

<head>
    <title>Joke Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            text-align: center;
        }

        #joke {
            font-size: 20px;
            margin: 30px 0;
            min-height: 60px;
        }

        button {
            padding: 10px 24px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h2>Random Joke Generator</h2>
    <p id="joke">Click the button to get a joke</p>
    <button id="jokeBtn">Get Joke</button>

    <script>
        let jokeBtn = document.querySelector("#jokeBtn")
        let jokeParagraph = document.querySelector("#joke")

        async function getJoke() {
            try {
                jokeParagraph.textContent = "Loading..."
                let response = await fetch("https://official-joke-api.appspot.com/random_joke")
                let data = await response.json()
                jokeParagraph.textContent = `${data.setup} ... ${data.punchline}`
            } catch (error) {
                jokeParagraph.textContent = "Something went wrong. Try again!"
            }
        }

        jokeBtn.addEventListener("click", getJoke)
    </script>
</body>

</html>
